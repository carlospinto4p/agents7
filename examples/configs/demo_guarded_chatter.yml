# Guard configuration — use a model at least as capable as
# the chatter (ideally stronger) for reliable detection.
# Small models (< 3B) often miss character breaks.
guard:
    engine:
        provider: ollama
        model: qwen3:4b

# Retry up to 2 times if the guard rejects a response,
# then fall back to the guard's suggested fix.
max_guard_retries: 2

# Send the last 3 conversation turns to the guard for context.
guard_context_turns: 3
