# Inherits engine config from demo_base.yml.
# Only overrides name, system_prompt, and output_model.
base_config: demo_base.yml
name: PersonExtractor
system_prompt: |
  Extract information about people from the given text.

  ## Rules

  1. Extract only information that is explicitly stated or clearly implied.
  2. If a field cannot be determined from the text, leave it as null.
  3. For age, extract the numeric value only.
  4. For occupation, use a concise job title.
  5. For location, extract city, country, or region as mentioned.
output_model: agents7.models.demo.PersonInfo
system_examples:
    - input: "John is a 35-year-old software engineer living in Berlin."
      output:
        name: John
        age: 35
        occupation: software engineer
        location: Berlin
    - input: "Yesterday I saw a movie about robots."
      output:
        name: null
        age: null
        occupation: null
        location: null
