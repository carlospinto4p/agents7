name: DemoTemperatureDetector
version: 1
engine:
    provider: ollama
    model: qwen3
system_prompt: |
  Analyze the input text and detect the temperature it refers to, expressed in degrees Celsius.
  
  ## Rules
  
  1. If an exact temperature is explicitly stated, return that value.
  2. If only descriptive terms are used, estimate the temperature using these defaults:
    - “Comfortable” → ~20 °C
    - “Hot” → ≥30 °C
    - “Cold” → ≤10 °C
  3. Use contextual clues; the temperature does not need to be explicitly mentioned.
  4. If no temperature-related context exists, output "Not Applicable".
  
  If the text contains no temperature-related meaning, return: Not Applicable.
output_model: agents7.models.demo.Temperature
system_examples:
    - input: Water could get frozen here.
      output:
        value': -10
        reason': TOO_COLD
    - input: The weather feels perfect for a walk.
      output:
        value: 20
        reason: COMFORTABLE
    - input: We’re in the desert at noon.
      output:
        value: 35
        reason: TOO_HOT
    - input: She bought a new car.
      output:
        value: None
        reason: NOT_APPLICABLE
