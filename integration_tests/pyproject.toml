[project]
name = "agents7-integration-tests"
version = "0.1.0"
description = "Integration tests for agents7 (requires Ollama)."
requires-python = ">=3.11"
dependencies = [
    "agents7",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
agents7 = { path = "..", editable = true }
