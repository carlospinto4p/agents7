[project]
name = "agents7"
version = "0.0.5"
description = "LLM Agents Management."
authors = [{ name = "Carlos Pinto", email = "carlospinto4p@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cpinto>=0.4.6",
    "ollama>=0.5.1",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.12.1",
    "pytest>=8.4.1",
]

[tool.ruff]
line-length = 78

[tool.uv.sources]
cpinto = { index = "gitlab_cpinto" }

[[tool.uv.index]]
name = "gitlab_cpinto"
url = "https://gitlab.com/api/v4/projects/42232103/packages/pypi/simple"
authenticate = "always"
