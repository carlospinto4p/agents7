[project]
name = "agents7"
version = "4.0.1"
description = "LLM Agents Management."
authors = [{ name = "Carlos Pinto", email = "carlospinto4p@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5.4",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.13.0",
    "pytest>=8.4.2",
]
openai = [
    "openai>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests", "integration_tests"]
filterwarnings = [
    "ignore:agents7\\.export is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 78

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

