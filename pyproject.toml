[project]
name = "agents7"
version = "3.12.13"
description = "LLM Agents Management."
authors = [{ name = "Carlos Pinto", email = "carlospinto4p@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cpinto>=0.4.10",
    "ollama>=0.5.4",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.13.0",
    "pytest>=8.4.2",
]
openai = [
    "openai>=1.0.0",
]
ui = [
    "streamlit>=1.45.0",
    "polars>=1.0.0",
    "plotly>=6.0.0",
]

[project.scripts]
agents7-ui = "agents7.ui.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests", "integration_tests"]

[tool.ruff]
line-length = 78

[tool.uv.sources]
cpinto = { index = "gitlab_cpinto" }

[[tool.uv.index]]
name = "gitlab_cpinto"
url = "https://gitlab.com/api/v4/projects/42232103/packages/pypi/simple"
authenticate = "always"
