services:
  app:
    build:
      context: .
      secrets:
        - gitlab_token
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    # host.docker.internal resolves automatically on Docker Desktop
    # (Windows/Mac). On native Linux Docker (20.10+), the extra_hosts
    # directive below maps it via the host-gateway special address.
    extra_hosts:
      - "host.docker.internal:host-gateway"

secrets:
  gitlab_token:
    # Read from the host env var GITLAB_TOKEN at build time only.
    # The secret is never injected into the running container's
    # environment — it exists solely as /run/secrets/gitlab_token
    # during the RUN --mount=type=secret layer in the Dockerfile.
    environment: GITLAB_TOKEN
